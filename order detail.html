<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success - BhuvaneshwariMart</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        .success-box {
            width: 90%;
            max-width: 600px;
            margin: 100px auto;
            background: white;
            padding: 45px 25px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .icon {
            font-size: 70px;
        }

        h1 {
            color: #198754;
            margin: 20px 0 10px;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
        }

        .order-id {
            margin: 20px 0;
            padding: 15px;
            background: #f1f7ff;
            border-radius: 8px;
            color: #0d6efd;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 25px;
            background: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="success-box">

    <div class="icon">🎉</div>

    <h1>Order Successful!</h1>

    <p>
        Your vegetables and fruits order has been placed successfully.
    </p>

    <div class="order-id" id="orderId">
        Order ID: Loading...
    </div>

    <p>
        Thank you for shopping with BhuvaneshwariMart.
    </p>

    <a href="home.html" class="btn">
        Continue Shopping
    </a>

</div>

<script>

    const order =
        JSON.parse(localStorage.getItem("latestOrder"));

    if (order && order.orderId) {

        document.getElementById("orderId").textContent =
            "Order ID: " + order.orderId;

    } else {

        document.getElementById("orderId").textContent =
            "Order ID: BWM-ORDER";

    }

</script>

</body>
</html>
