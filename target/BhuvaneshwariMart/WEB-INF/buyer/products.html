        .unit {
            color: #777;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .rating {
            font-size: 14px;
            margin-bottom: 10px;
        }

        .price {
            color: #0878d1;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .view-btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background: #0878d1;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .view-btn:hover {
            background: #0564ad;
        }

        footer {
            margin-top: 50px;
            background: #0878d1;
            color: white;
            text-align: center;
            padding: 25px;
        }

/* DISPLAY PRODUCTS */

function displayProducts(productList) {

    const grid =
        document.getElementById("productsGrid");

    grid.innerHTML = "";

    productList.forEach(function(product) {

        const card =
            document.createElement("div");

        card.className =
            "product-card";

        card.innerHTML = `

            <div class="product-image">
                ${product.emoji}
            </div>

            <div class="category">
                ${getCategoryName(product.category)}
            </div>

            <h3>
                ${product.name}
            </h3>

            <div class="unit">
                ${product.unit}
            </div>

            <div class="rating">
                ⭐⭐⭐⭐⭐ ${product.rating}
            </div>

            <div class="price">
                ₹${product.price}
            </div>

            <button
                class="view-btn"
                type="button"
                onclick="viewProduct(${product.id})">
                View Details
            </button>

        `;

        grid.appendChild(card);

    });

}


/* CATEGORY NAME */

function getCategoryName(category) {

    if (category === "vegetable") {
        return "Vegetable";
    }

    if (category === "fruit") {
        return "Fruit";
    }

    if (category === "leafy") {
        return "Leafy Green";
    }

    if (category === "fresh") {
        return "Fresh Food";
    }

    return "Fresh Product";
}


/* FILTER PRODUCTS */

function filterProducts(category) {

    const buttons =
        document.querySelectorAll(".filter-btn");

    buttons.forEach(function(button) {
        button.classList.remove("active");
    });

    event.target.classList.add("active");

    if (category === "all") {

        displayProducts(products);

    } else {

        const filteredProducts =
            products.filter(function(product) {
                return product.category === category;
            });

        displayProducts(filteredProducts);
    }

}


/* VIEW PRODUCT DETAILS */

function viewProduct(productId) {

    const product =
        products.find(function(item) {
            return item.id === productId;
        });

    if (!product) {
        return;
    }

    /*
       Save selected product.
       Product Details page will read this.
    */

    localStorage.setItem(
        "selectedProduct",
        JSON.stringify(product)
    );

    /*
       Go ONLY to Product Details.
       No Add to Cart from this page.
    */

    window.location.href =
        "product-details.html";
}
