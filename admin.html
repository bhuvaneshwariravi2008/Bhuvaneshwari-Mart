<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Akshara Mart</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="admin-root"></div>

<script src="js/products.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script>
  const ADMIN_KEY = 'akshara_admin_session';
  function isAdmin(){ return localStorage.getItem(ADMIN_KEY) === '1'; }

  // local admin-editable copy of the catalog (extra products added here persist in this session's localStorage)
  function getCatalog(){
    try { const extra = JSON.parse(localStorage.getItem('akshara_admin_products')) || []; return AKSHARA_DATA.products.concat(extra); }
    catch(e){ return AKSHARA_DATA.products; }
  }
  function addAdminProduct(p){
    const extra = JSON.parse(localStorage.getItem('akshara_admin_products') || '[]');
    extra.push(p);
    localStorage.setItem('akshara_admin_products', JSON.stringify(extra));
  }

  function renderLogin(){
    document.getElementById('admin-root').innerHTML = `
      <div class="auth-shell">
        <div class="auth-card">
          <a href="index.html" class="logo"><span class="mark">A</span><span>Akshara Mart</span></a>
          <h2>Admin Login</h2>
          <p class="sub">Seller / Admin access only</p>
          <div class="toast-msg error" id="adminErr"></div>
          <form id="adminForm">
            <div class="field"><label>Admin Email / Username</label><input name="user" required value="admin@aksharamart.in"></div>
            <div class="field"><label>Password</label><input type="password" name="pass" required value="admin123"></div>
            <button class="btn btn-primary btn-block" type="submit">Login</button>
          </form>
          <p class="form-note" style="font-size:.78rem">Demo credentials are pre-filled — this is a front-end demo panel.</p>
        </div>
      </div>`;
    document.getElementById('adminForm').addEventListener('submit', function(e){
      e.preventDefault();
      if (this.user.value === 'admin@aksharamart.in' && this.pass.value === 'admin123'){
        localStorage.setItem(ADMIN_KEY, '1');
        renderDashboard();
      } else {
        const box = document.getElementById('adminErr');
        box.textContent = 'Invalid admin credentials.';
        box.classList.add('show');
      }
    });
  }

  function renderDashboard(section){
    section = section || 'dashboard';
    const catalog = getCatalog();
    const orders = getOrders();
    const users = getUsers();
    const totalSales = orders.reduce((s,o)=> s + o.totals.total, 0);
    const lowStock = catalog.filter(p => p.stock > 0 && p.stock <= 5).length;

    const nav = [
      ['dashboard','Dashboard'], ['products','Products'], ['orders','Orders'], ['customers','Customers']
    ];

    document.getElementById('admin-root').innerHTML = `
      <div class="admin-shell">
        <aside class="admin-side">
          <a href="index.html" class="logo"><span class="mark">A</span><span>Akshara Mart</span></a>
          ${nav.map(([k,l]) => `<a href="#" data-sec="${k}" class="${k===section?'active':''}">${l}</a>`).join('')}
          <a href="#" onclick="localStorage.removeItem(ADMIN_KEY);renderLogin();return false;" style="margin-top:20px">Logout</a>
        </aside>
        <main class="admin-main">
          <div class="admin-topbar">
            <h2 style="font-size:1.4rem">${nav.find(n=>n[0]===section)[1]}</h2>
            <span class="badge-role">Admin</span>
          </div>
          <div id="admin-content"></div>
        </main>
      </div>`;

    document.querySelectorAll('.admin-side a[data-sec]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); renderDashboard(a.dataset.sec); }));

    const content = document.getElementById('admin-content');

    if (section === 'dashboard'){
      content.innerHTML = `
        <div class="kpi-grid">
          <div class="kpi-card"><div class="v">${catalog.length}</div><div class="l">Total Products</div></div>
          <div class="kpi-card"><div class="v">${users.length}</div><div class="l">Total Customers</div></div>
          <div class="kpi-card"><div class="v">${orders.length}</div><div class="l">Total Orders</div></div>
          <div class="kpi-card"><div class="v">${fmt(totalSales)}</div><div class="l">Total Sales</div></div>
          <div class="kpi-card"><div class="v" style="color:var(--sale)">${lowStock}</div><div class="l">Low Stock Products</div></div>
        </div>
        <div class="table-card">
          <div class="between"><h3 style="font-size:1rem">Recent Orders</h3></div>
          <table class="admin-table">
            <tr><th>Order ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>
            ${orders.slice(0,8).map(o => `<tr><td>${o.id}</td><td>${o.user}</td><td>${o.items.length}</td><td>${fmt(o.totals.total)}</td><td><span class="status-pill status-${o.status.replace(/ /g,'-')}">${o.status}</span></td></tr>`).join('') || '<tr><td colspan="5" style="color:var(--ink-soft)">No orders yet.</td></tr>'}
          </table>
        </div>`;
    }

    if (section === 'products'){
      content.innerHTML = `
        <div class="table-card">
          <div class="between">
            <h3 style="font-size:1rem">All Appliances (${catalog.length})</h3>
            <button class="btn btn-teal btn-sm" onclick="document.getElementById('addProductForm').style.display='block'">+ Add Appliance</button>
          </div>
          <div id="addProductForm" style="display:none;margin-bottom:18px;border:1px solid var(--line);border-radius:10px;padding:16px">
            <div class="grid-2">
              <div class="field"><label>Product Name</label><input id="np_name"></div>
              <div class="field"><label>Category</label>
                <select id="np_cat" style="width:100%;padding:11px;border:1px solid var(--line);border-radius:8px">
                  ${AKSHARA_DATA.categories.map(c=>`<option value="${c.key}">${c.name}</option>`).join('')}
                </select>
              </div>
            </div>
            <div class="grid-2">
              <div class="field"><label>Price (₹)</label><input id="np_price" type="number"></div>
              <div class="field"><label>Stock Quantity</label><input id="np_stock" type="number"></div>
            </div>
            <button class="btn btn-primary btn-sm" onclick="submitNewProduct()">Save Product</button>
          </div>
          <table class="admin-table">
            <tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Rating</th><th>Actions</th></tr>
            ${catalog.slice(0,60).map(p => `
              <tr>
                <td>${p.name}</td><td>${p.category}</td><td>${fmt(p.price)}</td>
                <td style="color:${p.stock<=5?'var(--sale)':'inherit'}">${p.stock}</td>
                <td>★ ${p.rating}</td>
                <td><button class="pill-btn edit" onclick="alert('Edit form would open for: ${p.name.replace(/'/g,"")}')">Edit</button><button class="pill-btn danger" onclick="alert('Delete confirmation for: ${p.name.replace(/'/g,"")}')">Delete</button></td>
              </tr>`).join('')}
          </table>
          <p style="font-size:.78rem;color:var(--ink-soft);margin-top:10px">Showing first 60 of ${catalog.length} products.</p>
        </div>`;
    }

    if (section === 'orders'){
      content.innerHTML = `
        <div class="table-card">
          <h3 style="font-size:1rem;margin-bottom:16px">Customer Orders</h3>
          <table class="admin-table">
            <tr><th>Order ID</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Update</th></tr>
            ${orders.map(o => `
              <tr>
                <td>${o.id}</td><td>${o.user}</td><td>${new Date(o.date).toLocaleDateString('en-IN')}</td>
                <td>${fmt(o.totals.total)}</td>
                <td><span class="status-pill status-${o.status.replace(/ /g,'-')}">${o.status}</span></td>
                <td>
                  <select onchange="updateOrderStatus('${o.id}', this.value)" style="padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:.78rem">
                    ${['Order Placed','Processing','Shipped','Out for Delivery','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
                  </select>
                </td>
              </tr>`).join('') || '<tr><td colspan="6" style="color:var(--ink-soft)">No orders yet.</td></tr>'}
          </table>
        </div>`;
    }

    if (section === 'customers'){
      content.innerHTML = `
        <div class="table-card">
          <h3 style="font-size:1rem;margin-bottom:16px">Registered Customers</h3>
          <table class="admin-table">
            <tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th></tr>
            ${users.map(u => `<tr><td>${u.name}</td><td>${u.email}</td><td>${u.phone||'—'}</td><td>${new Date(u.created).toLocaleDateString('en-IN')}</td></tr>`).join('') || '<tr><td colspan="4" style="color:var(--ink-soft)">No customers yet.</td></tr>'}
          </table>
        </div>`;
    }
  }

  function submitNewProduct(){
    const name = document.getElementById('np_name').value.trim();
    const cat = document.getElementById('np_cat').value;
    const price = parseFloat(document.getElementById('np_price').value) || 0;
    const stock = parseInt(document.getElementById('np_stock').value) || 0;
    if (!name || !price) { alert('Please fill in product name and price.'); return; }
    const c = getCategory(cat);
    addAdminProduct({
      id: 9000 + Math.floor(Math.random()*1000), name, brand:'Akshara Select', category_key:cat, category:c.name,
      price, original_price: Math.round(price*1.2), discount: 17, rating: 4.2, num_ratings: 0, stock,
      stock_status: stock>0?'In Stock':'Out of Stock',
      description:'Newly added appliance.', specs:{ Brand:'Akshara Select', Category:c.name, Warranty:'1 Year' }
    });
    toast('Product added');
    renderDashboard('products');
  }

  function updateOrderStatus(orderId, status){
    const orders = getOrders().map(o => o.id === orderId ? { ...o, status } : o);
    saveOrders(orders);
    toast('Order status updated');
    renderDashboard('orders');
  }

  isAdmin() ? renderDashboard() : renderLogin();
</script>
</body>
</html>
