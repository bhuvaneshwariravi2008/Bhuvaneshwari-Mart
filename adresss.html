<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Address - BhuvaneshwariMart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #0d6efd;
            color: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        header a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
        }

        .title h1 {
            color: #0d6efd;
            margin-bottom: 8px;
        }

        .title p {
            color: #666;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #0d6efd;
        }

        .address-type {
            margin: 10px 0 25px;
        }

        .address-type label {
            display: inline-block;
            margin-right: 25px;
            font-weight: normal;
        }

        .address-type input {
            width: auto;
            margin-right: 6px;
        }

        .continue-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #0d6efd;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .continue-btn:hover {
            background: #0b5ed7;
        }

        .error {
            display: none;
            background: #ffe5e5;
            color: #c00;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 18px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #777;
        }

        @media (max-width: 650px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🛒 BhuvaneshwariMart</div>
    <a href="cart.html">🛒 Cart</a>
</header>

<div class="container">

    <div class="title">
        <h1>Delivery Address</h1>
        <p>Enter your delivery details</p>
    </div>

    <div class="card">

        <div id="errorMessage" class="error">
            Please fill all required fields.
        </div>

        <form id="addressForm">

            <div class="form-row">

                <div class="form-group">
                    <label>Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="form-group">
                    <label>Mobile Number</label>
                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter mobile number"
                        maxlength="10"
                        required>
                </div>

                <div class="form-group full">
                    <label>Address</label>
                    <textarea
                        id="address"
                        placeholder="House No, Street, Area"
                        required></textarea>
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input
                        type="text"
                        id="city"
                        placeholder="Enter city"
                        required>
                </div>

                <div class="form-group">
                    <label>State</label>
                    <input
                        type="text"
                        id="state"
                        placeholder="Enter state"
                        required>
                </div>

                <div class="form-group">
                    <label>PIN Code</label>
                    <input
                        type="text"
                        id="pincode"
                        placeholder="Enter PIN code"
                        maxlength="6"
                        required>
                </div>

                <div class="form-group">
                    <label>Landmark</label>
                    <input
                        type="text"
                        id="landmark"
                        placeholder="Nearby landmark">
                </div>

            </div>

            <div class="address-type">

                <strong>Address Type:</strong>

                <label>
                    <input
                        type="radio"
                        name="addressType"
                        value="Home"
                        checked>
                    Home
                </label>

                <label>
                    <input
                        type="radio"
                        name="addressType"
                        value="Work">
                    Work
                </label>

            </div>

            <button type="submit" class="continue-btn">
                SAVE & CONTINUE →
            </button>

        </form>

    </div>
</div>

<footer>
    © 2026 BhuvaneshwariMart. Fresh Vegetables & Fruits Delivered.
</footer>

<script>

    document.getElementById("addressForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const fullName = document.getElementById("fullName").value.trim();
        const mobile = document.getElementById("mobile").value.trim();
        const address = document.getElementById("address").value.trim();
        const city = document.getElementById("city").value.trim();
        const state = document.getElementById("state").value.trim();
        const pincode = document.getElementById("pincode").value.trim();
        const landmark = document.getElementById("landmark").value.trim();

        const errorMessage = document.getElementById("errorMessage");

        if (
            !fullName ||
            !mobile ||
            !address ||
            !city ||
            !state ||
            !pincode
        ) {
            errorMessage.style.display = "block";
            return;
        }

        if (!/^[0-9]{10}$/.test(mobile)) {
            errorMessage.textContent =
                "Please enter a valid 10-digit mobile number.";
            errorMessage.style.display = "block";
            return;
        }

        if (!/^[0-9]{6}$/.test(pincode)) {
            errorMessage.textContent =
                "Please enter a valid 6-digit PIN code.";
            errorMessage.style.display = "block";
            return;
        }

        const addressType =
            document.querySelector(
                'input[name="addressType"]:checked'
            ).value;

        const deliveryAddress = {
            fullName: fullName,
            mobile: mobile,
            address: address,
            city: city,
            state: state,
            pincode: pincode,
            landmark: landmark,
            addressType: addressType
        };

        localStorage.setItem(
            "deliveryAddress",
            JSON.stringify(deliveryAddress)
        );

        window.location.href = "order-summary.html";

    });

</script>

</body>
</html>
